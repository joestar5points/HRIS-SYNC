[project]
name = "hris-sync"
version = "1.0.2"
description = "Abstracted HRIS to Entra ID / Exchange Online identity sync"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hris-sync = "hris_sync.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
